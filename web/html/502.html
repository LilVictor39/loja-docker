<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>502 Bad Gateway</title>
  <style>
    :root {
      --ink: #15191f;
      --danger: #e84855;
      --gold: #ffbf3f;
      --shadow: 0 26px 70px rgba(21, 25, 31, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 191, 63, 0.5), transparent 28%),
        radial-gradient(circle at 82% 76%, rgba(0, 166, 166, 0.35), transparent 26%),
        linear-gradient(135deg, #fff2bc 0%, #ffe8ee 48%, #ebfbff 100%);
    }

    body::before {
      content: "502 502 502 502 502 502 502";
      position: fixed;
      inset: auto -10vw 12vh -10vw;
      color: rgba(21, 25, 31, 0.08);
      font-size: clamp(4rem, 11vw, 10rem);
      font-weight: 900;
      white-space: nowrap;
      transform: rotate(-8deg);
    }

    .error-card {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 32px));
      padding: clamp(26px, 7vw, 58px);
      border: 4px solid var(--ink);
      border-radius: 8px;
      background: rgba(255, 248, 223, 0.92);
      box-shadow: var(--shadow), 8px 8px 0 var(--ink);
      text-align: center;
      transform: rotate(-1deg);
    }

    .label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--danger);
      color: white;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .fight-stage {
      position: relative;
      width: min(520px, 86vw);
      height: clamp(170px, 34vw, 240px);
      margin: 26px auto 20px;
    }

    .fighter {
      position: absolute;
      top: 50%;
      display: block;
      width: clamp(96px, 24vw, 160px);
      height: clamp(96px, 24vw, 160px);
      object-fit: contain;
      filter: drop-shadow(0 18px 22px rgba(21, 25, 31, 0.24));
    }

    .college-logo {
      left: 4%;
      animation: logo-hit 1.25s ease-in-out infinite;
      transform-origin: center;
      z-index: 2;
    }

    .weapon {
      position: absolute;
      left: 30%;
      top: 23%;
      z-index: 3;
      width: clamp(88px, 20vw, 138px);
      height: 22px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: linear-gradient(90deg, #8f5a2a 0%, #c9853a 52%, #f0b25b 100%);
      box-shadow: 4px 5px 0 rgba(21, 25, 31, 0.28);
      transform-origin: 16% 50%;
      animation: weapon-swing 1.25s ease-in-out infinite;
    }

    .weapon::before {
      content: "";
      position: absolute;
      right: -18px;
      top: 50%;
      width: 38px;
      height: 38px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #d99a4a;
      transform: translateY(-50%);
    }

    .professor {
      right: 4%;
      border: 4px solid white;
      border-radius: 50%;
      object-fit: cover;
      animation: professor-hit 1.25s ease-in-out infinite;
      z-index: 1;
    }

    .impact {
      position: absolute;
      left: 72%;
      top: 47%;
      width: 64px;
      height: 64px;
      border: 4px solid var(--danger);
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
      animation: impact-pop 1.25s ease-in-out infinite;
      z-index: 3;
    }

    .impact::before,
    .impact::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 86px;
      height: 5px;
      border-radius: 999px;
      background: var(--danger);
      transform: translate(-50%, -50%) rotate(28deg);
    }

    .impact::after {
      transform: translate(-50%, -50%) rotate(-28deg);
      background: var(--gold);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 5.4rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    p {
      max-width: 520px;
      margin: 18px auto 0;
      color: #4f5964;
      font-size: clamp(1rem, 2.7vw, 1.22rem);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      font-weight: 900;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    a:first-child {
      background: var(--gold);
    }

    a:hover {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    @keyframes logo-hit {
      0% {
        transform: translate(-16px, -50%) rotate(-8deg) scale(1);
      }
      45% {
        transform: translate(250px, -50%) rotate(14deg) scale(1.08);
      }
      55% {
        transform: translate(250px, -50%) rotate(14deg) scale(1.08);
      }
      100% {
        transform: translate(-16px, -50%) rotate(-8deg) scale(1);
      }
    }

    @keyframes weapon-swing {
      0% {
        transform: translate(-18px, 10px) rotate(-34deg);
      }
      34% {
        transform: translate(130px, -16px) rotate(-64deg);
      }
      48% {
        transform: translate(236px, -8px) rotate(17deg);
      }
      58% {
        transform: translate(236px, -8px) rotate(17deg);
      }
      100% {
        transform: translate(-18px, 10px) rotate(-34deg);
      }
    }

    @keyframes professor-hit {
      0%, 42% {
        transform: translate(0, -50%) rotate(1deg);
      }
      52% {
        transform: translate(46px, -50%) rotate(13deg);
      }
      68% {
        transform: translate(24px, -50%) rotate(-8deg);
      }
      100% {
        transform: translate(0, -50%) rotate(1deg);
      }
    }

    @keyframes impact-pop {
      0%, 39%, 64%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      }
      48% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05) rotate(18deg);
      }
      56% {
        opacity: 0.75;
        transform: translate(-50%, -50%) scale(1.3) rotate(28deg);
      }
    }

    @media (max-width: 560px) {
      body {
        overflow-y: auto;
        padding: 18px 0;
      }

      .error-card {
        transform: none;
      }

      .college-logo {
        animation-name: logo-hit-mobile;
      }

      .weapon {
        animation-name: weapon-swing-mobile;
      }

      @keyframes logo-hit-mobile {
        0% {
          transform: translate(-10px, -50%) rotate(-8deg) scale(1);
        }
        45% {
          transform: translate(34vw, -50%) rotate(14deg) scale(1.08);
        }
        55% {
          transform: translate(34vw, -50%) rotate(14deg) scale(1.08);
        }
        100% {
          transform: translate(-10px, -50%) rotate(-8deg) scale(1);
        }
      }

      @keyframes weapon-swing-mobile {
        0% {
          transform: translate(-12px, 10px) rotate(-34deg);
        }
        34% {
          transform: translate(18vw, -14px) rotate(-64deg);
        }
        48% {
          transform: translate(32vw, -8px) rotate(17deg);
        }
        58% {
          transform: translate(32vw, -8px) rotate(17deg);
        }
        100% {
          transform: translate(-12px, 10px) rotate(-34deg);
        }
      }
    }
  </style>
</head>
<body>
  <main class="error-card">
    <span class="label">Bad Gateway detectado</span>
    <div class="fight-stage" aria-label="Logo da faculdade batendo no professor">
      <img class="fighter college-logo" src="/OIP.png" alt="Logo da faculdade">
      <span class="weapon" aria-hidden="true"></span>
      <span class="impact" aria-hidden="true"></span>
      <img class="fighter professor" src="/professor.png" alt="Professor">
    </div>
    <h1>502</h1>
    <p>A API caiu e a faculdade malvada apareceu para cobrar explicacões.</p>
    <div class="actions">
      <a href="/">Voltar para a loja</a>
      <a href="/api/">Tentar de novo</a>
    </div>
  </main>
</body>
</html>
